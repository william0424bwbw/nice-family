<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICE家族即時親師數位看板</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --card-bg: #2d2d3a;
            --text-main: #ffffff;
            --text-sub: #b3b3cc;
            --level-0: #2a9d8f;
            --level-1: #f4a261;
            --level-2: #e63946;
            --level-3: #7209b7;

            --subject-chinese: #4cc9f0;
            --subject-math: #2a9d8f;
            --subject-exam: #a14bf6;
            --subject-custom: #fccc52;
        }

        html, body { background-color: var(--bg-color); min-height: 100vh; }

        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            font-size: 0.9rem;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .title-area { max-width: 1400px; margin: 0 auto; text-align: center; padding-top: 5px; position: relative; }
        h1 { font-size: 2rem; color: #4cc9f0; margin: 0 0 5px 0; text-shadow: 0 0 10px rgba(76, 201, 240, 0.3); }
        .subtitle { color: var(--text-sub); margin-bottom: 12px; font-size: 0.9rem; font-weight: bold; }
        .subtitle button { margin-left: 8px; background: #3b3b4f; color: #b3b3cc; border: 1px solid #4e4e62; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 0.8rem; }

        .top-search-zone { position: absolute; right: 10px; top: 10px; background: #3b3b4f; padding: 4px 8px; border-radius: 8px; display: flex; gap: 6px; align-items: center; border: 1px solid #4cc9f0; }
        .search-input { width: 50px; padding: 4px; font-size: 0.85rem; border-radius: 5px; border: none; text-align: center; font-weight: bold; }
        .btn-search { background-color: #4cc9f0; color: #1e1e24; border: none; padding: 4px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        @media (max-width: 700px) {
            h1 { font-size: 1.4rem; }
            .top-search-zone { position: static; justify-content: center; margin: 0 auto 10px auto; width: fit-content; }
        }

        .mode-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 18px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; transition: 0.3s; background-color: #3b3b4f; color: #b3b3cc; }
        .tab-btn.active { background-color: #4cc9f0; color: #1e1e24; box-shadow: 0 0 15px rgba(76, 201, 240, 0.5); }

        .teacher-tools-row { width: 100%; display: flex; justify-content: center; gap: 12px; margin-top: 10px; border-top: 1px dashed #4e4e62; padding-top: 10px; flex-wrap: wrap; }
        .btn-sync-cloud { background-color: #2a9d8f; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-export-all { background-color: #fccc52; color: #1e1e24; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-clear-all { background-color: #e63946; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-trash { background-color: #4361ee; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        .control-panel { background: #252530; padding: 12px; border-radius: 12px; max-width: 1000px; margin: 0 auto 15px auto; display: none; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; border: 1px solid #3e3e50; }
        .select-style, .input-style, .btn-add { padding: 8px 14px; font-size: 0.9rem; border-radius: 8px; border: none; outline: none; font-weight: bold; }
        .select-style { background-color: #3b3b4f; color: white; cursor: pointer; }
        .input-style { background-color: #fff; color: #333; width: 150px; user-select: text; -webkit-user-select: text; }
        .btn-add { background-color: #4cc9f0; color: #1e1e24; cursor: pointer; font-weight: bold; }
        .btn-add:disabled { opacity: 0.5; cursor: wait; }

        .check-container { display: flex; align-items: center; gap: 5px; color: #fccc52; font-weight: bold; font-size: 0.85rem; cursor: pointer; background: rgba(252,204,82,0.1); padding: 6px 10px; border-radius: 8px; border: 1px dashed #fccc52; }
        .check-container input { width: 14px; height: 14px; cursor: pointer; }

        .dual-track-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1450px; margin: 0 auto; padding-bottom: 30px; }
        .track-column { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: flex-start; background: rgba(45, 45, 58, 0.15); border-radius: 16px; padding: 12px; border: 1px dashed #3e3e50; min-height: 200px; }
        @media (max-width: 900px) { .dual-track-wrapper { grid-template-columns: 1fr; } }
        @media (max-width: 480px) { .track-column { grid-template-columns: 1fr; } .track-header-title { grid-column: span 1 !important; } }

        .track-header-title { grid-column: span 2; font-size: 1.1rem; font-weight: bold; padding-bottom: 6px; border-bottom: 2px solid #3e3e50; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
        .track-chinese-title { color: var(--subject-chinese); }
        .track-math-title { color: var(--subject-math); }

        .homework-card { background: var(--card-bg); border-radius: 12px; padding: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); border: 2px solid #3e3e50; position: relative; transition: all 0.4s ease; box-sizing: border-box; width: 100% !important; }
        .homework-card.fade-out { transform: scale(0.8) translateY(-40px); opacity: 0; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; border-bottom: 1px dashed #4e4e62; padding-bottom: 4px; gap: 5px; }
        .card-title { font-size: 0.95rem; font-weight: bold; color: var(--subject-custom); word-break: break-all; line-height: 1.3; flex-grow: 1; }
        .card-chinese .card-title { color: var(--subject-chinese); }
        .card-math .card-title { color: var(--subject-math); }
        .card-exam .card-title { color: var(--subject-exam); }

        .header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .btn-lock { background-color: #4361ee; color: white; border: none; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        .btn-lock.locked { background-color: #2a9d8f; }
        .btn-grip { background: #3e3e50; color: #ddd; border: none; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; line-height: 1.2; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
        .homework-card.dragging { position: fixed; z-index: 1000; pointer-events: none; opacity: 0.92; transform: rotate(1.5deg); box-shadow: 0 16px 40px rgba(0,0,0,0.6); border-color: #4cc9f0; transition: none; }
        .card-placeholder { border: 2px dashed #4cc9f0; border-radius: 12px; background: rgba(76, 201, 240, 0.08); }
        body.is-dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
        .btn-delete { background: none; border: none; color: #ef4444; font-size: 0.95rem; cursor: pointer; padding: 0 2px; }

        .student-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .student-node { aspect-ratio: 1.15; border: none; border-radius: 5px; font-size: 0.8rem; font-weight: bold; color: white; background-color: var(--level-0); transition: all 0.15s ease; box-shadow: 0 2px 0 rgba(0,0,0,0.2); padding: 2px 0; touch-action: manipulation; }
        .teacher-mode .student-node { cursor: pointer; }
        .hide-green-mode .student-node[data-status="0"] { display: none; }
        .student-node.pending { outline: 2px dashed #fff; outline-offset: -3px; }

        .student-node.status-1 { background-color: var(--level-1); color: #1e1e24; }
        .student-node.status-2 { background-color: var(--level-2); font-size: 0.95rem; box-shadow: 0 0 6px rgba(230, 57, 70, 0.4); }
        .student-node.status-3 {
            background-color: var(--level-3);
            font-size: 0.95rem;
            border-radius: 50% !important;
            animation: neon-shining 0.6s infinite alternate;
        }

        @keyframes neon-shining {
            0% { opacity: 0.6; box-shadow: 0 0 3px #7209b7, inset 0 0 1px #fff; }
            100% { opacity: 1; box-shadow: 0 0 12px #9d4edd, inset 0 0 6px #fff; transform: scale(1.03); }
        }
        @keyframes explode-effect { 0% { transform: scale(1); background-color: #fff; box-shadow: 0 0 15px #fff; } 50% { transform: scale(1.3); background-color: #fccc52; box-shadow: 0 0 30px #fccc52; } 100% { transform: scale(1); background-color: var(--level-0); } }
        .exploding { animation: explode-effect 0.4s ease-out !important; }

        .photo-gallery-container { max-width: 1000px; margin: 0 auto; display: none; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding-bottom: 40px; }
        .photo-album-card { background: #252530; border-radius: 14px; border: 2px solid #3e3e50; overflow: hidden; box-shadow: 0 8px 15px rgba(0,0,0,0.2); transition: all 0.3s; text-decoration: none; color: white; display: flex; flex-direction: column; position: relative; }
        .photo-album-card:hover { transform: translateY(-5px); border-color: #4cc9f0; box-shadow: 0 12px 25px rgba(76,201,240,0.3); }
        .photo-album-card a { color: inherit; text-decoration: none; display: flex; flex-direction: column; flex-grow: 1; }
        .album-icon-zone { background: #313143; height: 120px; display: flex; justify-content: center; align-items: center; font-size: 3.5rem; }
        .album-info-zone { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .album-name { font-size: 1.05rem; font-weight: bold; color: #4cc9f0; margin-bottom: 6px; line-height: 1.4; }
        .album-desc { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 10px; }
        .album-action-hint { font-size: 0.85rem; color: #fccc52; font-weight: bold; text-align: right; }
        .btn-del-photo { position: absolute; top: 10px; right: 10px; background: rgba(230,57,70,0.8); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-weight: bold; cursor: pointer; z-index: 10; }

        .shut-up-wall { max-width: 1300px; margin: 25px auto 60px auto; background: rgba(37, 37, 48, 0.95); border: 3px dashed #ef4444; border-radius: 16px; padding: 15px; display: none; }
        .wall-title { font-size: 1.25rem; color: #ef4444; font-weight: bold; margin-bottom: 12px; border-bottom: 2px solid #ef4444; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .wall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .wall-student-box { background: #1e1e24; border: 1px solid #3e3e50; border-radius: 8px; padding: 8px; min-height: 50px; }
        .wall-student-box.has-debt { border-color: #f4a261; background: #2d2327; }
        .wall-student-box.clean { border-color: #2a9d8f; background: #1a2926; opacity: 0.5; }
        .wall-no { font-weight: bold; font-size: 1rem; border-bottom: 1px solid #4e4e62; padding-bottom: 2px; margin-bottom: 4px; }
        .wall-no.is-clean { color: #2a9d8f; }
        .wall-no.is-debt { color: #f4a261; }
        .wall-debt-item { font-size: 0.8rem; margin: 2px 0; color: #b3b3cc; }
        .btn-close { background:#ef4444; color:white; border:none; padding:4px 10px; border-radius:5px; cursor:pointer; font-weight:bold; }

        .loading-hint { text-align: center; font-size: 1.2rem; color: #fccc52; margin: 15px; }
        .empty-hint { grid-column: 1 / -1; color: #6e6e88; text-align: center; padding: 20px 0; }

        /* 對話框（登入、復原） */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .overlay.show { display: flex; }
        .dialog { background: #252530; border: 2px solid #4cc9f0; border-radius: 14px; padding: 18px; width: 100%; max-width: 420px; max-height: 80vh; overflow-y: auto; box-sizing: border-box; }
        .dialog h2 { margin: 0 0 12px 0; color: #4cc9f0; font-size: 1.2rem; }
        .dialog .input-style { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .dialog-error { color: #ef4444; font-weight: bold; min-height: 1.2em; margin-bottom: 8px; }
        .trash-section { color: #fccc52; font-weight: bold; margin: 12px 0 6px 0; }
        .trash-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #3e3e50; }
        .trash-meta { color: var(--text-sub); font-size: 0.75rem; }
        .btn-restore { background: #2a9d8f; color: white; border: none; border-radius: 6px; padding: 4px 10px; font-weight: bold; cursor: pointer; flex-shrink: 0; }

        /* 提示訊息 */
        .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #e63946; color: white; padding: 10px 16px; border-radius: 10px; font-weight: bold; z-index: 200; display: none; max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
        .toast.ok { background: #2a9d8f; }
        .toast.show { display: block; }
        .toast-action { margin-left: 12px; background: #fff; color: #1e1e24; border: none; border-radius: 6px; padding: 4px 12px; font-weight: bold; cursor: pointer; }

        /* 只有老師看得到的按鈕 */
        body:not(.role-teacher) .teacher-only { display: none !important; }
        .btn-counter { background-color: #f4a261; color: #1e1e24; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-helpers { background-color: #7209b7; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        /* 誰登記的小徽章（小秘書） */
        .student-node { position: relative; }
        .mark-badge { position: absolute; top: 1px; right: 1px; font-size: 0.55rem; line-height: 1; background: rgba(0,0,0,0.6); color: #fff; border-radius: 4px; padding: 1px 2px; pointer-events: none; font-weight: bold; }
        .student-node.status-3 .mark-badge { top: -3px; right: -3px; }

        .dialog.wide { max-width: 540px; }

        /* 補交櫃台 */
        .counter-seats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
        .counter-seat { min-height: 46px; border: none; border-radius: 8px; background: #3b3b4f; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
        .counter-seat small { font-size: 0.7rem; color: #fccc52; }
        .counter-seat.zero { opacity: 0.35; }
        .counter-seat.zero small { color: #b3b3cc; }
        .counter-seat.selected { background: #4cc9f0; color: #1e1e24; opacity: 1; }
        .counter-seat.selected small { color: #1e1e24; }
        .counter-title { font-size: 1.05rem; font-weight: bold; color: #fccc52; margin: 4px 0 8px 0; }
        .counter-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed #3e3e50; }
        .counter-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
        .counter-dot.s1 { background: var(--level-1); } .counter-dot.s2 { background: var(--level-2); } .counter-dot.s3 { background: var(--level-3); }
        .counter-name { flex-grow: 1; min-width: 0; word-break: break-all; }
        .counter-name .trash-meta { display: block; }
        .btn-done { background: #2a9d8f; color: white; border: none; border-radius: 8px; padding: 8px 14px; min-height: 40px; font-weight: bold; cursor: pointer; flex-shrink: 0; font-size: 0.95rem; }
        .btn-done:disabled { opacity: 0.5; cursor: wait; }
        .counter-all { width: 100%; margin-top: 12px; }
        .counter-clean { text-align: center; color: #2a9d8f; font-weight: bold; font-size: 1.1rem; padding: 16px 0; }

        /* 小秘書管理 */
        .acct-row { padding: 10px 0; border-bottom: 1px dashed #3e3e50; }
        .acct-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .acct-badge { background: #4cc9f0; color: #1e1e24; border-radius: 6px; padding: 2px 6px; font-weight: bold; }
        .acct-off { color: #ef4444; font-size: 0.8rem; }
        .acct-on { color: #2a9d8f; font-size: 0.8rem; }
        .acct-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .acct-actions button { background: #3b3b4f; color: white; border: 1px solid #4e4e62; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-weight: bold; }
        .pw-box { background: #1e1e24; border: 2px dashed #fccc52; border-radius: 10px; padding: 12px; margin: 10px 0; text-align: center; }
        .pw-box .pw { font-size: 2rem; font-weight: bold; letter-spacing: 0.2em; color: #fccc52; user-select: text; -webkit-user-select: text; font-family: Consolas, monospace; }
        .pw-box .trash-meta { margin-top: 4px; }
    </style>
</head>
<body>

    <div class="title-area">
        <h1>📋 NICE家族即時親師數位看板</h1>
        <div class="subtitle"><span id="viewModeHint">正在連線…</span><button id="myPwBtn" style="display:none" onclick="openMyPassword()">🔑 改密碼</button><button id="logoutBtn" style="display:none" onclick="logout()">登出</button></div>

        <div class="top-search-zone">
            <input type="number" class="search-input" id="searchNo" placeholder="座號" min="1" max="25" inputmode="numeric">
            <button class="btn-search" onclick="searchStudentMissing()">🔍 查缺交</button>
        </div>
    </div>

    <div class="mode-tabs">
        <button class="tab-btn active" id="tabDaily" onclick="switchMode('daily')">📁 日常作業消消樂</button>
        <button class="tab-btn" id="tabExam" onclick="switchMode('exam')">📊 學期考試大標靶</button>
        <button class="tab-btn" id="tabPhotos" onclick="switchMode('photos')">📸 NICE家族生活剪影</button>
    </div>

    <div class="control-panel" id="controlPanelDaily">
        <select class="select-style" id="taskSelect" onchange="toggleCustomInput()">
            <option value="">-- 請選擇日常作業 --</option>
            <option value="國習">國習</option><option value="預習本">預習本</option><option value="圈詞">圈詞</option><option value="甲本">甲本</option><option value="乙本">乙本</option><option value="聽寫">聽寫</option><option value="字音字形">字音字形</option><option value="數習">數習</option><option value="數重">數重</option><option value="數作">數作</option>
            <option value="CUSTOM">💡 自行輸入新作業</option>
        </select>
        <input type="text" class="input-style" id="customInput" placeholder="請打上新作業名稱" style="display:none;" maxlength="30">

        <select class="select-style" id="trackDaily" style="background:#4361ee;" title="放在哪一欄（之後也可以拖曳卡片換欄）">
            <option value="auto">🔀 分類：自動判斷</option>
            <option value="chinese">📘 分類：語文類</option>
            <option value="math">📐 分類：數學與其他</option>
        </select>

        <label class="check-container">
            <input type="checkbox" id="defaultDebtDaily"> 📢 預設全班未完成
        </label>

        <button class="btn-add" id="addDailyBtn" onclick="createNewCard()">＋ 掛上登記板</button>

        <div class="teacher-tools-row">
            <button class="btn-sync-cloud" onclick="loadBoard(true)">🔄 重新整理</button>
            <button class="btn-export-all" onclick="exportDebtReport()">📊 產出並複製總表 (展開閉嘴牆)</button>
            <button class="btn-counter teacher-only" onclick="openCounter()">🧾 補交櫃台</button>
            <button class="btn-helpers teacher-only" onclick="openAccounts()">👥 小秘書</button>
            <button class="btn-trash teacher-only" onclick="openTrash()">♻️ 復原</button>
            <button class="btn-clear-all teacher-only" onclick="triggerClear()">🧹 清空日常作業</button>
        </div>
    </div>

    <div class="control-panel" id="controlPanelExam">
        <select class="select-style" id="examSubject">
            <option value="國語">國語</option><option value="數學">數學</option><option value="社會">社會</option><option value="自然">自然</option><option value="其他">其他</option>
        </select>
        <input type="text" class="input-style" id="examUnitInput" placeholder="單元 (例如: 第一單元)" maxlength="30">


        <label class="check-container">
            <input type="checkbox" id="defaultDebtExam"> 📢 預設全班未完成
        </label>

        <button class="btn-add" id="addExamBtn" onclick="addNewExamCard()">＋ 掛上考試卡片</button>

        <div class="teacher-tools-row">
            <button class="btn-sync-cloud" onclick="loadBoard(true)">🔄 重新整理</button>
            <button class="btn-export-all" onclick="exportDebtReport()">📊 產出並複製總表 (展開閉嘴牆)</button>
            <button class="btn-counter teacher-only" onclick="openCounter()">🧾 補交櫃台</button>
            <button class="btn-helpers teacher-only" onclick="openAccounts()">👥 小秘書</button>
            <button class="btn-trash teacher-only" onclick="openTrash()">♻️ 復原</button>
            <button class="btn-clear-all teacher-only" onclick="triggerClear()">🧹 清空學期考試</button>
        </div>
    </div>

    <div class="control-panel" id="controlPanelPhotos">
        <select class="select-style" id="photoIconSelect">
            <option value="🎒">🎒 學校生活</option><option value="🏐">🏐 體育球賽</option><option value="👣">👣 戶外健行</option><option value="🌟">🌟 精采表演</option><option value="🎨">🎨 美術創作</option><option value="📸">📸 其他隨拍</option>

        <input type="text" class="input-style" id="photoNameInput" placeholder="輸入相簿主標題" maxlength="40">

    <div class="loading-hint" id="loadingHint">⏳ 資料讀取中，請稍候...</div>

    <div class="dual-track-wrapper" id="dailyTracksZone">
        <div class="track-column" id="dailyChineseTrack"></div>
        <div class="track-column" id="dailyMathTrack"></div>
    </div>

    <div class="dual-track-wrapper" id="examTracksZone" style="display:none;">
        <div class="track-column" id="examChineseTrack"></div>
        <div class="track-column" id="examMathTrack"></div>

    <div class="photo-gallery-container" id="photoGalleryContainer"></div>

    <div class="shut-up-wall" id="shutUpWall">
        <div class="wall-title">
            <span>🥊 NICE家族 欠交/補考 閉嘴牆 (全班大對決)</span>

    <!-- 老師登入 -->
    <div class="overlay" id="loginOverlay">
        <form class="dialog" onsubmit="submitLogin(event)">
            <h2>🔒 老師／小秘書登入</h2>

            <div class="dialog-error" id="loginError"></div>
            <div class="dialog-actions">
                <button type="button" class="btn-close" style="background:#3b3b4f" onclick="cancelLogin()">以家長身分瀏覽</button>
                <button type="submit" class="btn-add" id="loginBtn">登入</button>
            </div>
        </form>
    </div>

    <!-- 小秘書改自己的密碼 -->
    <div class="overlay" id="myPwOverlay" onclick="if (event.target === this) closeMyPassword()">
        <form class="dialog" onsubmit="submitMyPassword(event)">
            <h2>🔑 改我的密碼</h2>
            <input type="password" class="input-style" id="myPwOld" placeholder="舊密碼" autocomplete="current-password">
            <input type="password" class="input-style" id="myPwNew" placeholder="新密碼（至少 6 個字）" autocomplete="new-password">
            <input type="password" class="input-style" id="myPwNew2" placeholder="再輸入一次新密碼" autocomplete="new-password">
            <div class="trash-meta" style="margin-bottom:8px">改好後請記下來；忘記的話請老師幫你重設。</div>
            <div class="dialog-error" id="myPwError"></div>
            <div class="dialog-actions">
                <button type="button" class="btn-close" style="background:#3b3b4f" onclick="closeMyPassword()">取消</button>
                <button type="submit" class="btn-add" id="myPwBtnSave">確定修改</button>
            </div>
        </form>
    </div>

    <!-- 復原 -->
    <div class="overlay" id="trashOverlay" onclick="if (event.target === this) closeTrash()">
        <div class="dialog">
            <h2>♻️ 復原取下的卡片與相簿</h2>
            <div id="trashList">讀取中…</div>
            <div class="dialog-actions" style="margin-top:12px"><button class="btn-close" onclick="closeTrash()">關閉</button></div>
        </div>
    </div>

    <!-- 補交櫃台（老師） -->
    <div class="overlay" id="counterOverlay" onclick="if (event.target === this) closeCounter()">
        <div class="dialog wide">
            <h2>🧾 補交櫃台</h2>
            <div class="trash-meta" style="margin-bottom:8px">點座號，看這位學生所有還沒交的項目</div>
            <div class="counter-seats" id="counterSeats"></div>
            <div id="counterList"></div>
            <div class="dialog-actions" style="margin-top:12px"><button class="btn-close" onclick="closeCounter()">關閉</button></div>
        </div>
    </div>

    <!-- 小秘書管理（老師） -->
    <div class="overlay" id="accountsOverlay" onclick="if (event.target === this) closeAccounts()">
        <div class="dialog">
            <h2>👥 小秘書帳號</h2>
            <div id="accountsPassword"></div>
            <div id="accountsList">讀取中…</div>
            <div class="dialog-actions" style="margin-top:12px; justify-content:space-between">
                <button class="btn-add" onclick="addAccount()">＋ 新增小秘書</button>
                <button class="btn-close" onclick="closeAccounts()">關閉</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const AUTH_KEY = 'nice-family-auth';
        const LEGACY_TOKEN_KEY = 'nice-family-teacher-token';
        const POLL_MS = 10000;
        const LONG_PRESS_MS = 800;

        // 登入身分：role = 'teacher'｜'helper'｜null（家長）
        let auth = { token: '', role: null, name: '', short: '' };
        let currentMode = 'daily';
        let board = { studentCount: 25, daily: [], exam: [], albums: [], me: null, undoMs: 300000 };
        // 送出中的點擊：key = "卡片編號:座號"；送出中時，定時更新不會把畫面蓋回舊狀態
        const pendingSeats = new Set();
        let pendingOther = 0;
        let changeEpoch = 0;
        let lastLoadOk = false;

        const isTeacher = () => auth.role === 'teacher';
        const isHelper = () => auth.role === 'helper';
        const loggedIn = () => isTeacher() || isHelper();
        const undoMs = () => board.undoMs || 300000;

        // ---------- 共用 ----------
        function storageGet(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }
        function storageSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch { /* 無痕模式 */ } }
        function pad(n) { return String(n).padStart(2, '0'); }
        function fmtTime(ms) {
            const d = new Date(ms);
            return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function readAuth() {
            try {
                const a = JSON.parse(storageGet(AUTH_KEY) || 'null');
                if (a && a.token) return a;
            } catch { /* 格式不對就當沒登入 */ }
            // 舊版只存老師密碼
            const legacy = storageGet(LEGACY_TOKEN_KEY);
            return legacy ? { token: legacy, role: 'teacher', name: '老師', short: '' } : null;
        }
        function saveAuth() {
            storageSet(AUTH_KEY, auth.token ? JSON.stringify(auth) : '');
            storageSet(LEGACY_TOKEN_KEY, '');
        }

        let toastTimer;
        // action：{ label, fn } 在提示上加一個按鈕（例如「復原」）
        function toast(msg, ok, action) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            if (action) {
                const b = el('button', 'toast-action', action.label);
                b.onclick = () => { t.className = 'toast'; action.fn(); };
                t.appendChild(b);
            }
            t.className = 'toast show' + (ok ? ' ok' : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.className = 'toast'; }, action ? 8000 : ok ? 2000 : 5000);
        }

        async function api(method, path, body) {
            const headers = {};
            if (auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
            if (body !== undefined) headers['Content-Type'] = 'application/json';
            let res;
            try {
                // 10 秒逾時：手機切換網路時請求可能卡住，不要讓畫面一直停在「送出中」
                const signal = typeof AbortSignal.timeout === 'function' ? AbortSignal.timeout(10000) : undefined;
                res = await fetch(path, { method, headers, signal, body: body === undefined ? undefined : JSON.stringify(body) });
            } catch {
                throw new Error('網路連線失敗或太慢，請再試一次');
            }
            if (res.status === 429) {
                const err = new Error('密碼錯誤太多次，請 10 分鐘後再試');
                err.status = 429;
                throw err;
            }
            let data = {};
            try { data = await res.json(); } catch { /* 沒有內容 */ }
            if (res.status === 401 && path !== '/api/auth') {
                passwordChanged('登入已失效，請重新輸入密碼');
            }
            if (!res.ok) {
                const err = new Error(data.error || '儲存失敗（' + res.status + '）');
                err.status = res.status;
                throw err;
            }
            return data;
        }

        // 密碼失效：立刻清掉本機的密碼（之後的輪詢不再帶錯的密碼，避免整個學校的 IP 被鎖），切回家長畫面並請重新登入
        function passwordChanged(msg) {
            if (auth.token) setAuth(null);
            showLogin(msg);
        }

        // ---------- 啟動與登入 ----------
        window.addEventListener('load', () => {
            const wantLogin = new URLSearchParams(location.search).get('mode') === 'teacher';
            const saved = readAuth();
            if (saved) {
                // 先用上次的身分顯示，再向伺服器確認
                setAuth(saved);
                verifyToken();
            } else {
                setAuth(null);
                if (wantLogin) showLogin('');
            }
            loadBoard(false);
            setInterval(() => { if (!document.hidden) loadBoard(false); }, POLL_MS);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) loadBoard(false); });
        });

        async function verifyToken() {
            try {
                const me = await api('POST', '/api/auth');
                setAuth({ token: auth.token, role: me.role || 'teacher', name: me.name || '老師', short: me.short || '' });
            } catch (e) {
                if (e.status === 401) passwordChanged('密碼已變更，請重新登入');
                else toast(e.message);
            }
        }

        function showLogin(msg) {
            document.getElementById('loginError').textContent = msg || '';
            document.getElementById('loginOverlay').classList.add('show');
            setTimeout(() => document.getElementById('loginPassword').focus(), 50);
        }
        function cancelLogin() {
            document.getElementById('loginOverlay').classList.remove('show');
            setAuth(null);
        }
        async function submitLogin(ev) {
            ev.preventDefault();
            const input = document.getElementById('loginPassword');
            const btn = document.getElementById('loginBtn');
            const prev = auth;
            auth = { token: input.value, role: null, name: '', short: '' };
            btn.disabled = true;
            try {
                const me = await api('POST', '/api/auth');
                input.value = '';
                document.getElementById('loginOverlay').classList.remove('show');
                setAuth({ token: auth.token, role: me.role || 'teacher', name: me.name || '老師', short: me.short || '' });
                toast(isHelper() ? '歡迎 ' + auth.name + '！' : '登入成功', true);
                loadBoard(false);
            } catch (e) {
                auth = prev.role ? prev : { token: '', role: null, name: '', short: '' };
                document.getElementById('loginError').textContent = e.status === 401 ? '密碼不正確' : e.message;
            } finally {
                btn.disabled = false;
            }
        }
        function logout() {
            setAuth(null);
            loadBoard(false);
            toast('已登出', true);
        }

        // ---------- 小秘書改自己的密碼 ----------
        function openMyPassword() {
            for (const id of ['myPwOld', 'myPwNew', 'myPwNew2']) document.getElementById(id).value = '';
            document.getElementById('myPwError').textContent = '';
            document.getElementById('myPwOverlay').classList.add('show');
            setTimeout(() => document.getElementById('myPwOld').focus(), 50);
        }
        function closeMyPassword() {
            document.getElementById('myPwOverlay').classList.remove('show');
        }
        async function submitMyPassword(ev) {
            ev.preventDefault();
            const oldPassword = document.getElementById('myPwOld').value;
            const newPassword = document.getElementById('myPwNew').value;
            const err = document.getElementById('myPwError');
            if (!oldPassword) { err.textContent = '請輸入舊密碼'; return; }
            if (newPassword.length < 6 || /\s/.test(newPassword)) { err.textContent = '新密碼要至少 6 個字，不能有空白'; return; }
            if (newPassword !== document.getElementById('myPwNew2').value) { err.textContent = '兩次輸入的新密碼不一樣'; return; }
            const btn = document.getElementById('myPwBtnSave');
            btn.disabled = true;
            try {
                await api('POST', '/api/me/password', { oldPassword, newPassword });
                setAuth({ ...auth, token: newPassword });   // 這台裝置直接換成新密碼，不用重新登入
                closeMyPassword();
                toast('密碼已修改，下次登入請用新密碼', true);
            } catch (e) {
                err.textContent = e.message;
            } finally {
                btn.disabled = false;
            }
        }

        function setAuth(a) {
            auth = a && a.token ? { token: a.token, role: a.role, name: a.name || '', short: a.short || '' } : { token: '', role: null, name: '', short: '' };
            saveAuth();
            document.body.classList.toggle('teacher-mode', loggedIn());
            document.body.classList.toggle('role-teacher', isTeacher());
            document.body.classList.toggle('role-helper', isHelper());
            document.getElementById('logoutBtn').style.display = loggedIn() ? 'inline-block' : 'none';
            document.getElementById('myPwBtn').style.display = isHelper() ? 'inline-block' : 'none';
            if (!isHelper()) closeMyPassword();
            document.getElementById('viewModeHint').textContent = isTeacher()
                ? '🔒 大熊老師管理模式（點一下升一級，長按銷帳；多台裝置可以同時使用）'
                : isHelper()
                    ? '📝 小秘書 ' + auth.name + ' 登記模式（點一下登記沒交，自己 5 分鐘內的可以長按取消）'
                    : '👁️ 家長/學生即時查閱看板（每 10 秒自動更新）';
            if (!isTeacher()) { closeCounter(); closeAccounts(); closeTrash(); }
            updateControlPanelVisibility();
            renderAll();
        }

        // ---------- 讀取 ----------
        async function loadBoard(manual) {
            if (manual) document.getElementById('loadingHint').style.display = 'block';
            const epoch = changeEpoch;
            const sentToken = auth.token;
            try {
                const data = await api('GET', '/api/board');
                // 帶了密碼卻被當成家長：密碼已被老師改掉或停用
                if (sentToken && sentToken === auth.token && !data.me) {
                    passwordChanged('密碼已變更，請重新登入');
                }
                // 有點擊還在送出，或讀取期間有修改：這份資料可能是舊的，不要蓋掉畫面（下一輪再更新）
                if (pendingSeats.size || pendingOther || epoch !== changeEpoch) {
                    if (manual) { document.getElementById('loadingHint').style.display = 'none'; setTimeout(() => loadBoard(false), 1500); }
                    return;
                }
                board = data;
                // 伺服器確認的身分（例如老師改了秘書的名稱）
                if (data.me && auth.token && (data.me.role !== auth.role || data.me.name !== auth.name || data.me.short !== auth.short)) {
                    setAuth({ token: auth.token, role: data.me.role, name: data.me.name, short: data.me.short });
                }
                lastLoadOk = true;
                document.getElementById('searchNo').max = board.studentCount;
                document.getElementById('loadingHint').style.display = 'none';
                renderAll();
                if (manual) toast('已更新為最新資料', true);
            } catch (e) {
                const hint = document.getElementById('loadingHint');
                hint.style.display = 'block';
                hint.textContent = lastLoadOk ? '⚠️ 暫時連不上伺服器，畫面可能不是最新的' : '⚠️ 讀取失敗，請檢查網路';
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            for (const [m, tab] of [['daily', 'tabDaily'], ['exam', 'tabExam'], ['photos', 'tabPhotos']]) {
                document.getElementById(tab).classList.toggle('active', m === mode);
            }
            document.getElementById('dailyTracksZone').style.display = mode === 'daily' ? 'grid' : 'none';
            document.getElementById('examTracksZone').style.display = mode === 'exam' ? 'grid' : 'none';
            document.getElementById('photoGalleryContainer').style.display = mode === 'photos' ? 'grid' : 'none';
            if (mode === 'photos') hideWall();
            updateControlPanelVisibility();
        }

        function updateControlPanelVisibility() {
            document.getElementById('controlPanelDaily').style.display = loggedIn() && currentMode === 'daily' ? 'flex' : 'none';
            document.getElementById('controlPanelExam').style.display = loggedIn() && currentMode === 'exam' ? 'flex' : 'none';
            document.getElementById('controlPanelPhotos').style.display = isTeacher() && currentMode === 'photos' ? 'flex' : 'none';
        }

        // ---------- 畫面 ----------
        function getSubjectClass(title) {
            if (/[國字聽圈默預甲乙]/.test(title)) return 'card-chinese';
            if (title.includes('數')) return 'card-math';
            return '';
        }
        // 卡片在哪一欄：老師設定過（新增時選、或拖曳到另一欄）就照設定，否則依名稱判斷
        function trackOf(card) {
            if (card.track) return card.track;
            return getSubjectClass(card.name) === 'card-chinese' ? 'chinese' : 'math';
        }
        // 卡片標題顏色跟著所在的欄
        function cardClass(card) {
            if (card.track === 'chinese') return 'card-chinese';
            if (card.track === 'math') return getSubjectClass(card.name) === 'card-chinese' ? 'card-math' : getSubjectClass(card.name);
            return getSubjectClass(card.name);
        }

        function findCard(id) {
            return board.daily.find(c => c.id === id) || board.exam.find(c => c.id === id);
        }
        function markOf(card, seat) {
            return card && card.marks ? card.marks[String(seat)] || null : null;
        }

        let renderQueued = false;
        function renderAll() {
            if (press || drag) { renderQueued = true; return; }
            renderTracks('daily', 'dailyChineseTrack', 'dailyMathTrack',
                '📘 語文類特區 (國語/甲乙本/聽圈默)', '📐 數學與其他特區 (數習/數作/控卡)');
            renderTracks('exam', 'examChineseTrack', 'examMathTrack',
                '📘 語文類考試 (國語考卷/聽寫)', '📐 數學與其他考試 (單元卷/總複習)');
            renderPhotoGallery();
            if (document.getElementById('shutUpWall').style.display === 'block') buildShutUpWall();
            if (document.getElementById('counterOverlay').classList.contains('show')) renderCounter();
        }

        function renderTracks(kind, chId, mathId, chTitle, mathTitle) {
            const ch = document.getElementById(chId);
            const math = document.getElementById(mathId);
            ch.dataset.kind = kind; ch.dataset.track = 'chinese';
            math.dataset.kind = kind; math.dataset.track = 'math';
            ch.replaceChildren(el('div', 'track-header-title track-chinese-title', chTitle));
            math.replaceChildren(el('div', 'track-header-title track-math-title', mathTitle));
            for (const card of board[kind]) {
                const c = buildCard(card, kind);
                (trackOf(card) === 'chinese' ? ch : math).appendChild(c);
            }
        }

        // 秘書可以取下自己 5 分鐘內建立的卡片
        function canRemoveCard(card) {
            if (isTeacher()) return true;
            return isHelper() && card.createdBy === auth.name && Date.now() - card.createdAt < undoMs();
        }

        function buildCard(card, kind) {
            const box = el('div', 'homework-card ' + cardClass(card));
            box.dataset.cardId = card.id;
            if (card.locked || !loggedIn()) box.classList.add('hide-green-mode');

            const header = el('div', 'card-header');
            const title = el('div', 'card-title', (kind === 'exam' ? '📝 ' : '') + card.name);
            title.title = card.name + (card.createdBy ? '（' + card.createdBy + ' 建立）' : '');
            header.appendChild(title);

            if (loggedIn()) {
                const actions = el('div', 'header-actions');
                if (isTeacher()) {
                    const grip = el('button', 'btn-grip', '⠿');
                    grip.title = '按住拖曳，調整順序或移到另一欄';
                    grip.addEventListener('pointerdown', e => startDrag(e, box, kind));
                    grip.addEventListener('contextmenu', e => e.preventDefault());
                    actions.appendChild(grip);
                }
                // 登記完按「確定」：已交的人收起來，只留下沒交的；要再登記就按「展開」
                const lockBtn = el('button', 'btn-lock' + (card.locked ? ' locked' : ''), card.locked ? '✏️ 展開' : '✅ 確定');
                lockBtn.title = card.locked ? '展開全部座號，繼續登記' : '登記完成：只留下沒交的人';
                lockBtn.onclick = () => toggleLock(card.id);
                actions.appendChild(lockBtn);
                if (canRemoveCard(card)) {
                    const delBtn = el('button', 'btn-delete', '🗑️');
                    delBtn.title = isTeacher() ? '取下（可以復原）' : '取下我剛建立的卡片';
                    delBtn.onclick = () => removeCard(card.id);
                    actions.appendChild(delBtn);
                }
                header.appendChild(actions);
            }
            box.appendChild(header);

            const matrix = el('div', 'student-matrix');
            for (let s = 1; s <= board.studentCount; s++) {
                const btn = el('button', '', pad(s));
                paintNode(btn, card.statuses[s - 1] || 0);
                const m = markOf(card, s);
                if (m && (card.statuses[s - 1] || 0) > 0) {
                    btn.title = m.by + ' ' + fmtTime(m.at) + ' 登記';
                    if (m.by !== '老師' && m.short) btn.appendChild(el('span', 'mark-badge', m.short));
                }
                if (pendingSeats.has(card.id + ':' + s)) btn.classList.add('pending');
                if (loggedIn()) bindNodeEvents(btn, card.id, s);
                matrix.appendChild(btn);
            }
            box.appendChild(matrix);
            return box;
        }

        // ---------- 拖曳排列卡片（只有老師） ----------
        // 用 pointer 事件自己做，手機和電腦都能用；拖曳期間不重畫畫面
        let drag = null;
        function startDrag(e, box, kind) {
            if (e.button) return;
            e.preventDefault();
            const r = box.getBoundingClientRect();
            const ph = el('div', 'card-placeholder');
            ph.style.height = r.height + 'px';
            box.parentNode.insertBefore(ph, box);
            box.classList.add('dragging');
            box.style.setProperty('width', r.width + 'px', 'important');
            box.style.left = r.left + 'px';
            box.style.top = r.top + 'px';
            document.body.appendChild(box);
            drag = { box, ph, kind, dx: e.clientX - r.left, dy: e.clientY - r.top, x: e.clientX, y: e.clientY, scroll: null };
            document.body.classList.add('is-dragging');
            document.addEventListener('pointermove', onDragMove);
            document.addEventListener('pointerup', onDragEnd);
            document.addEventListener('pointercancel', onDragCancel);
            drag.scroll = setInterval(autoScroll, 30);
        }
        // 拖到畫面上下邊緣時自動捲動
        function autoScroll() {
            if (!drag) return;
            const edge = 70;
            if (drag.y < edge) window.scrollBy(0, -12);
            else if (drag.y > window.innerHeight - edge) window.scrollBy(0, 12);
            else return;
            placeDrag();
        }
        function onDragMove(e) {
            if (!drag) return;
            drag.x = e.clientX; drag.y = e.clientY;
            drag.box.style.left = (e.clientX - drag.dx) + 'px';
            drag.box.style.top = (e.clientY - drag.dy) + 'px';
            placeDrag();
        }
        // 依手指位置，把預留位置放到最近的欄、正確的順序
        function placeDrag() {
            const { x, y, kind, ph } = drag;
            const cols = [...document.querySelectorAll('.track-column[data-kind="' + kind + '"]')];
            let col = null, best = Infinity;
            for (const c of cols) {
                const r = c.getBoundingClientRect();
                const dx = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
                const dy = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
                if (dx + dy < best) { best = dx + dy; col = c; }
            }
            if (!col) return;
            const cards = [...col.querySelectorAll(':scope > .homework-card')];
            const before = cards.find(c => {
                const r = c.getBoundingClientRect();
                return y < r.top || (y <= r.bottom && x < r.left + r.width / 2);
            });
            if (before) { if (ph.nextSibling !== before) col.insertBefore(ph, before); }
            else if (col.lastElementChild !== ph) col.appendChild(ph);
        }
        function stopDrag() {
            document.removeEventListener('pointermove', onDragMove);
            document.removeEventListener('pointerup', onDragEnd);
            document.removeEventListener('pointercancel', onDragCancel);
            clearInterval(drag.scroll);
            const d = drag;
            d.box.classList.remove('dragging');
            d.box.style.removeProperty('width'); d.box.style.left = ''; d.box.style.top = '';
            d.ph.replaceWith(d.box);
            document.body.classList.remove('is-dragging');
            drag = null;
            return d;
        }
        function onDragCancel() {
            if (!drag) return;
            stopDrag();
            renderQueued = false;
            renderAll();
        }
        async function onDragEnd() {
            if (!drag) return;
            const { box, kind } = stopDrag();
            const col = box.parentNode;
            const track = col.dataset.track;
            const id = Number(box.dataset.cardId);
            const ids = [...col.querySelectorAll(':scope > .homework-card')].map(c => Number(c.dataset.cardId));
            const card = findCard(id);
            const oldTrack = card ? trackOf(card) : track;
            const oldIds = board[kind].filter(c => trackOf(c) === track).map(c => c.id);
            if (oldTrack === track && JSON.stringify(oldIds) === JSON.stringify(ids)) {
                renderQueued = false; renderAll(); return;   // 沒有移動
            }
            // 先在畫面上照新的順序排好，再存到雲端
            const pos = new Map();
            for (const c of document.querySelectorAll('.track-column[data-kind="' + kind + '"] > .homework-card')) pos.set(Number(c.dataset.cardId), pos.size);
            board[kind].sort((a, b) => (pos.get(a.id) ?? 1e9) - (pos.get(b.id) ?? 1e9));
            for (const c of board[kind]) if (ids.includes(c.id)) c.track = track;
            renderQueued = false;
            renderAll();
            try {
                await withPending(() => api('POST', '/api/cards/order', { kind, track, ids }));
                if (oldTrack !== track) toast('已移到「' + (track === 'chinese' ? '語文類' : '數學與其他') + '」，之後同名作業也會放在這一欄', true);
            } catch (err) {
                toast(err.message);
            }
            loadBoard(false);
        }

        function paintNode(btn, status) {
            btn.dataset.status = status;
            btn.className = 'student-node' + (status > 0 ? ' status-' + status : '');
        }

        // 點一下：升一級（綠 → 橘 → 紅 → 紫，到紫色就停住，不會繞回綠色）
        // 長按：老師 → 銷帳（變回綠色）；小秘書 → 取消自己 5 分鐘內的登記
        // 手指按住期間不重畫畫面（重畫會換掉按鈕，造成漏點或長按計時器取消不掉）
        let press = null;      // 目前按住的格子
        let lastPress = null;  // 最近一次按壓（click 用來判斷是不是長按）
        function endPress() {
            if (press) { clearTimeout(press.timer); press = null; }
            if (renderQueued) { renderQueued = false; setTimeout(renderAll, 0); }
        }
        document.addEventListener('pointerup', endPress, true);
        document.addEventListener('pointercancel', endPress, true);

        function bindNodeEvents(btn, cardId, seat) {
            btn.addEventListener('pointerdown', () => {
                endPress();
                const p = { cardId, seat, long: false };
                p.timer = setTimeout(() => { p.long = true; onLongPress(btn, cardId, seat); }, LONG_PRESS_MS);
                press = p; lastPress = p;
            });
            btn.addEventListener('pointerleave', () => { if (press && press.cardId === cardId && press.seat === seat) endPress(); });
            btn.addEventListener('contextmenu', e => e.preventDefault());
            btn.addEventListener('click', () => {
                if (lastPress && lastPress.long && lastPress.cardId === cardId && lastPress.seat === seat) { lastPress = null; return; }
                const card = findCard(cardId); if (!card) return;
                const now = card.statuses[seat - 1] || 0;
                if (btn.closest('.hide-green-mode') && now === 0) return;
                if (now >= 3) {
                    toast(isTeacher() ? '已經是最高等級（交了請長按銷帳）' : '已經是最高等級', true);
                    return;
                }
                setSeat(cardId, seat, now + 1);
            });
        }

        function onLongPress(btn, cardId, seat) {
            const card = findCard(cardId); if (!card) return;
            if (isTeacher()) {
                btn.className = 'student-node exploding';
                setTimeout(() => setSeat(cardId, seat, 0), 400);
                return;
            }
            const m = markOf(card, seat);
            const status = card.statuses[seat - 1] || 0;
            if (status > 0 && m && m.by === auth.name && Date.now() - m.at < undoMs()) {
                undoSeat(cardId, seat);
            } else {
                toast('只有老師可以銷帳；自己 5 分鐘內登記的可以長按取消');
            }
        }

        // 同一格一次只送一個請求：連點時先改畫面，等上一個存好再送「最後的狀態」
        // （舊版連點會同時送出好幾個請求，到達順序不一定，會存成中間的狀態）
        // 回傳 Promise，補交櫃台的「全部交了」會依序等待
        const seatSync = new Map();
        function setSeat(cardId, seat, status) {
            const card = findCard(cardId); if (!card) return Promise.resolve();
            const key = cardId + ':' + seat;
            let st = seatSync.get(key);
            if (!st) { st = { want: status, saved: card.statuses[seat - 1] || 0, sending: false, done: null }; seatSync.set(key, st); }
            st.want = status;
            card.statuses[seat - 1] = status;
            pendingSeats.add(key);
            changeEpoch++;
            renderAll();
            if (st.sending) return st.done;
            st.sending = true;
            st.done = (async () => {
                let removed = false;
                try {
                    while (st.want !== st.saved) {
                        const target = st.want;
                        const r = await api('PUT', '/api/cards/' + cardId + '/seats/' + seat, { status: target });
                        const before = st.saved;
                        st.saved = target;
                        updateLocalMark(cardId, seat, before, target);
                        if (r.removed) { removed = true; break; }
                    }
                } catch (e) {
                    seatSync.delete(key); pendingSeats.delete(key); changeEpoch++;
                    const c = findCard(cardId);
                    if (c) c.statuses[seat - 1] = st.saved;
                    renderAll();
                    if (e.status === 404 || e.status === 403 || e.status === 409) {
                        // 被拒絕（例如秘書不能降級、卡片已被取下）：還原這格並重新讀取
                        toast(e.message);
                        loadBoard(true);
                    } else {
                        toast(pad(seat) + ' 號沒有存到，已恢復成上次存好的狀態：' + e.message);
                    }
                    return;
                }
                seatSync.delete(key); pendingSeats.delete(key); changeEpoch++;
                if (removed) {
                    fadeOutCard(cardId);
                    // 點錯造成全班完成時，可以馬上按「復原」
                    toast('🎉 「' + card.name + '」全班完成，卡片收起來了', true, isTeacher() ? {
                        label: '↩ 復原',
                        fn: async () => {
                            try { await withPending(() => api('POST', '/api/cards/' + cardId + '/restore')); await loadBoard(false); toast('已復原「' + card.name + '」', true); }
                            catch (e) { toast(e.message); }
                        },
                    } : undefined);
                } else {
                    renderAll();
                }
            })();
            return st.done;
        }

        // 存好後先在本機標上「誰登記的」，不用等下一次讀取
        function updateLocalMark(cardId, seat, before, after) {
            const c = findCard(cardId); if (!c) return;
            if (!c.marks) c.marks = {};
            if (after === 0) delete c.marks[String(seat)];
            else if (after > before) c.marks[String(seat)] = { by: auth.name || '老師', short: auth.short || '', at: Date.now() };
        }

        // 小秘書取消自己 5 分鐘內的登記（由伺服器還原成登記前的狀態）
        async function undoSeat(cardId, seat) {
            const key = cardId + ':' + seat;
            if (seatSync.has(key) || pendingSeats.has(key)) { toast('這格還在存檔，請稍候再試'); return; }
            pendingSeats.add(key); changeEpoch++;
            renderAll();
            try {
                const r = await api('POST', '/api/cards/' + cardId + '/seats/' + seat + '/undo');
                const c = findCard(cardId);
                if (c) {
                    c.statuses[seat - 1] = r.status || 0;
                    if (c.marks) delete c.marks[String(seat)];
                }
                toast('已取消 ' + pad(seat) + ' 號的登記', true);
            } catch (e) {
                toast(e.message);
            } finally {
                pendingSeats.delete(key); changeEpoch++;
                renderAll();
            }
            loadBoard(false);
        }

        function fadeOutCard(cardId) {
            const node = document.querySelector('[data-card-id="' + cardId + '"]');
            board.daily = board.daily.filter(c => c.id !== cardId);
            board.exam = board.exam.filter(c => c.id !== cardId);
            if (node) {
                node.classList.add('fade-out');
                setTimeout(renderAll, 400);
            } else {
                renderAll();
            }
        }

        async function withPending(fn) {
            pendingOther++; changeEpoch++;
            try { return await fn(); } finally { pendingOther--; changeEpoch++; }
        }

        async function toggleLock(cardId) {
            const card = findCard(cardId); if (!card) return;
            try {
                await withPending(() => api('PATCH', '/api/cards/' + cardId, { locked: !card.locked }));
                card.locked = !card.locked;
                renderAll();
            } catch (e) { toast(e.message); }
        }

        async function removeCard(cardId) {
            const card = findCard(cardId); if (!card) return;
            const owing = card.statuses.filter(s => s > 0).length;
            let msg;
            if (isTeacher()) {
                msg = '確定要取下「' + card.name + '」嗎？';
                if (owing) msg += '\n\n這張卡還有 ' + owing + ' 人沒交，取下後他們的欠交也會一起收起來（可以從 ♻️ 復原找回）';
                else msg += '（之後可以從 ♻️ 復原找回來）';
            } else {
                msg = '確定要取下你剛建立的「' + card.name + '」嗎？';
            }
            if (!confirm(msg)) return;
            try {
                await withPending(() => api('DELETE', '/api/cards/' + cardId));
                fadeOutCard(cardId);
            } catch (e) {
                toast(e.message);
                if (e.status === 403) loadBoard(true);
            }
        }

        async function postCard(body, btnId) {
            const btn = document.getElementById(btnId);
            btn.disabled = true;
            try {
                const r = await withPending(() => api('POST', '/api/cards', body));
                await loadBoard(false);
                toast(r.escalatedFrom ? '已掛上「' + r.name + '」，「' + r.escalatedFrom + '」沒交的人已自動升級' : '已掛上「' + r.name + '」', true);
                return true;
            } catch (e) {
                toast(e.message);
                return false;
            } finally {
                btn.disabled = false;
            }
        }

        async function createNewCard() {
            const select = document.getElementById('taskSelect');
            const customInput = document.getElementById('customInput');
            const baseName = (select.value === 'CUSTOM' ? customInput.value : select.value).trim();
            if (!baseName) { toast('請先選擇或輸入作業名稱'); return; }
            const ok = await postCard({
                kind: 'daily',
                baseName,
                track: document.getElementById('trackDaily').value,
                defaultDebt: document.getElementById('defaultDebtDaily').checked,
            }, 'addDailyBtn');
            if (ok) {
                select.value = ''; customInput.value = ''; customInput.style.display = 'none';
                document.getElementById('defaultDebtDaily').checked = false;
                document.getElementById('trackDaily').value = 'auto';
            }
        }

        async function addNewExamCard() {
            const unit = document.getElementById('examUnitInput').value.trim();
            if (!unit) { toast('請輸入單元'); return; }
            const ok = await postCard({
                kind: 'exam',
                subject: document.getElementById('examSubject').value,
                unit,
                defaultDebt: document.getElementById('defaultDebtExam').checked,
            }, 'addExamBtn');
            if (ok) {
                document.getElementById('examUnitInput').value = '';
                document.getElementById('defaultDebtExam').checked = false;
            }
        }

        // 清空：只收起全班都完成的卡片，還有人欠交的保留（欠交要一直記著）
        async function triggerClear() {
            const kind = currentMode === 'exam' ? 'exam' : 'daily';
            if (!confirm('確定清空？只會收起全班都完成的卡片，還有人欠交的會保留')) return;
            try {
                const r = await withPending(() => api('POST', '/api/cards/clear', { kind }));
                hideWall();
                await loadBoard(false);
                const cleared = r.cleared || 0;
                const kept = r.kept || 0;
                toast('收起 ' + cleared + ' 張全班完成的卡片' + (kept ? '；' + kept + ' 張還有人欠交，保留在看板上' : ''), true);
            } catch (e) { toast(e.message); }
        }

        // ---------- 補交櫃台（老師） ----------
        let counterSeat = null;
        function owedItems(seat) {
            const items = [];
            for (const [kind, list] of [['daily', board.daily], ['exam', board.exam]]) {
                for (const c of list) {
                    const s = c.statuses[seat - 1] || 0;
                    if (s > 0) items.push({ card: c, kind, status: s, mark: markOf(c, seat) });
                }
            }
            return items;
        }
        function openCounter(seat) {
            if (!isTeacher()) return;
            if (seat) counterSeat = seat;
            document.getElementById('counterOverlay').classList.add('show');
            renderCounter();
        }
        function closeCounter() { document.getElementById('counterOverlay').classList.remove('show'); }

        function renderCounter() {
            const seats = document.getElementById('counterSeats');
            seats.replaceChildren();
            for (let s = 1; s <= board.studentCount; s++) {
                const n = owedItems(s).length;
                const b = el('button', 'counter-seat' + (n ? '' : ' zero') + (s === counterSeat ? ' selected' : ''));
                b.appendChild(el('span', '', pad(s)));
                b.appendChild(el('small', '', n ? '欠 ' + n + ' 項' : '✓'));
                b.onclick = () => { counterSeat = s; renderCounter(); };
                seats.appendChild(b);
            }
            const list = document.getElementById('counterList');
            list.replaceChildren();
            if (!counterSeat) {
                list.appendChild(el('div', 'trash-meta', '請先點選座號'));
                return;
            }
            const seat = counterSeat;
            const items = owedItems(seat);
            if (!items.length) {
                list.appendChild(el('div', 'counter-clean', '🎉 ' + pad(seat) + ' 號全部交清'));
                return;
            }
            list.appendChild(el('div', 'counter-title', pad(seat) + ' 號 還欠 ' + items.length + ' 項'));
            for (const it of items) {
                const row = el('div', 'counter-item');
                row.appendChild(el('span', 'counter-dot s' + it.status));
                const name = el('div', 'counter-name', (it.kind === 'exam' ? '📝 ' : '📁 ') + it.card.name);
                const lv = ['', '未交', '再催', '嚴重'][it.status];
                name.appendChild(el('span', 'trash-meta', lv + (it.mark ? '・' + it.mark.by + ' ' + fmtTime(it.mark.at) + ' 登記' : '')));
                row.appendChild(name);
                const b = el('button', 'btn-done', '✔ 交了');
                b.onclick = () => { b.disabled = true; setSeat(it.card.id, seat, 0); };
                row.appendChild(b);
                list.appendChild(row);
            }
            if (items.length > 1) {
                const all = el('button', 'btn-done counter-all', '✔ 全部交了（' + items.length + ' 項）');
                all.onclick = async () => {
                    if (!confirm(pad(seat) + ' 號的 ' + items.length + ' 項全部交了？')) return;
                    all.disabled = true;
                    for (const it of items) {
                        if (findCard(it.card.id)) await setSeat(it.card.id, seat, 0);
                    }
                };
                list.appendChild(all);
            }
        }

        // ---------- 小秘書管理（老師） ----------
        async function openAccounts() {
            if (!isTeacher()) return;
            document.getElementById('accountsOverlay').classList.add('show');
            document.getElementById('accountsPassword').replaceChildren();
            await loadAccounts();
        }
        function closeAccounts() { document.getElementById('accountsOverlay').classList.remove('show'); }

        function showPassword(name, pw) {
            const box = document.getElementById('accountsPassword');
            box.replaceChildren();
            const wrap = el('div', 'pw-box');
            wrap.append(el('div', '', name + ' 的密碼'), el('div', 'pw', pw), el('div', 'trash-meta', '請抄下來，之後不會再顯示'));
            box.appendChild(wrap);
        }

        async function loadAccounts() {
            const list = document.getElementById('accountsList');
            list.textContent = '讀取中…';
            try {
                const r = await api('GET', '/api/accounts');
                list.replaceChildren();
                if (!r.accounts || !r.accounts.length) {
                    list.appendChild(el('div', 'trash-meta', '還沒有小秘書帳號'));
                    return;
                }
                for (const a of r.accounts) {
                    const row = el('div', 'acct-row');
                    const head = el('div', 'acct-head');
                    head.append(el('span', 'acct-badge', a.short || '?'), el('strong', '', a.name),
                        el('span', a.active ? 'acct-on' : 'acct-off', a.active ? '啟用中' : '已停用'));
                    row.appendChild(head);
                    const actions = el('div', 'acct-actions');
                    const rename = el('button', '', '✏️ 改名稱');
                    rename.onclick = () => renameAccount(a);
                    const reset = el('button', '', '🔑 重設密碼');
                    reset.onclick = () => resetPassword(a);
                    const toggle = el('button', '', a.active ? '⏸ 停用' : '▶ 啟用');
                    toggle.onclick = () => patchAccount(a, { active: !a.active }, a.active ? '已停用 ' + a.name : '已啟用 ' + a.name);
                    actions.append(rename, reset, toggle);
                    row.appendChild(actions);
                    list.appendChild(row);
                }
            } catch (e) {
                list.textContent = e.message;
            }
        }

        async function patchAccount(a, body, okMsg) {
            try {
                const r = await api('PATCH', '/api/accounts/' + a.id, body);
                if (r.password) showPassword(body.name || a.name, r.password);
                if (okMsg) toast(okMsg, true);
                await loadAccounts();
            } catch (e) { toast(e.message); }
        }

        function renameAccount(a) {
            const name = prompt('新的名稱', a.name);
            if (name === null || !name.trim()) return;
            const short = prompt('格子上顯示的徽章字（1 個字）', a.short || name.trim().slice(-1));
            if (short === null) return;
            patchAccount(a, { name: name.trim(), short: short.trim() || name.trim().slice(-1) }, '已更新');
        }

        function resetPassword(a) {
            const pw = prompt('重設「' + a.name + '」的密碼\n\n留空 = 隨機產生 6 位數\n或輸入你想要的新密碼', '');
            if (pw === null) return;
            patchAccount(a, { password: pw.trim() || 'random' });
        }

        async function addAccount() {
            const name = prompt('小秘書的名稱（例如：小狐狸）', '');
            if (name === null || !name.trim()) return;
            const short = prompt('格子上顯示的徽章字（1 個字）', name.trim().slice(-1));
            if (short === null) return;
            const pw = prompt('密碼\n\n留空 = 隨機產生 6 位數', '');
            if (pw === null) return;
            const body = { name: name.trim(), short: short.trim() || name.trim().slice(-1) };
            if (pw.trim()) body.password = pw.trim();
            try {
                const r = await api('POST', '/api/accounts', body);
                showPassword(body.name, r.password || pw.trim());
                toast('已新增 ' + body.name, true);
                await loadAccounts();
            } catch (e) { toast(e.message); }
        }

        // ---------- 相簿 ----------
        function renderPhotoGallery() {
            const container = document.getElementById('photoGalleryContainer');
            container.replaceChildren();
            if (!board.albums.length) container.appendChild(el('div', 'empty-hint', '還沒有相簿'));
            for (const p of board.albums) {
                const card = el('div', 'photo-album-card');
                if (isTeacher()) {
                    const del = el('button', 'btn-del-photo', '×'); del.title = '刪除（可以復原）';
                    del.onclick = (e) => { e.preventDefault(); e.stopPropagation(); removeAlbum(p); };
                    card.appendChild(del);
                }
                const a = document.createElement('a');
                if (/^https?:\/\//i.test(p.url)) a.href = p.url;
                a.target = '_blank'; a.rel = 'noopener noreferrer';
                const info = el('div', 'album-info-zone');
                const wrap = el('div');
                wrap.append(el('div', 'album-name', p.name), el('div', 'album-desc', p.description || ''));
                info.append(wrap, el('div', 'album-action-hint', '進入相簿觀看 ➜'));
                a.append(el('div', 'album-icon-zone', p.icon), info);
                card.appendChild(a);
                container.appendChild(card);
            }
        }

        async function addNewPhotoAlbum() {
            const nameInput = document.getElementById('photoNameInput');
            const descInput = document.getElementById('photoDescInput');
            const urlInput = document.getElementById('photoUrlInput');
            if (!nameInput.value.trim() || !urlInput.value.trim()) { toast('請至少填寫「相簿主標題」與「Google 相簿連結」'); return; }
            const btn = document.getElementById('addPhotoBtn');
            btn.disabled = true;
            try {
                await withPending(() => api('POST', '/api/albums', {
                    icon: document.getElementById('photoIconSelect').value,
                    name: nameInput.value, description: descInput.value, url: urlInput.value,
                }));
                nameInput.value = ''; descInput.value = ''; urlInput.value = '';
                await loadBoard(false);
                toast('📸 相簿發布成功', true);
            } catch (e) { toast(e.message); } finally { btn.disabled = false; }
        }

        async function removeAlbum(p) {
            if (!confirm('確定刪除「' + p.name + '」相簿？（之後可以從 ♻️ 復原找回來）')) return;
            try {
                await withPending(() => api('DELETE', '/api/albums/' + p.id));
                board.albums = board.albums.filter(a => a.id !== p.id);
                renderPhotoGallery();
            } catch (e) { toast(e.message); }
        }

        // ---------- 復原（老師） ----------
        const REASON = { manual: '手動取下', completed: '全班完成', clear: '清空', escalated: '被新卡接續' };

        async function openTrash() {
            if (!isTeacher()) return;
            document.getElementById('trashOverlay').classList.add('show');
            const list = document.getElementById('trashList');
            list.textContent = '讀取中…';
            try {
                const t = await api('GET', '/api/trash');
                list.replaceChildren();
                const section = (label) => list.appendChild(el('div', 'trash-section', label));
                const item = (title, meta, onRestore) => {
                    const row = el('div', 'trash-item');
                    const left = el('div');
                    left.append(el('div', '', title), el('div', 'trash-meta', meta));
                    const b = el('button', 'btn-restore', '復原');
                    b.onclick = async () => {
                        b.disabled = true;
                        try { await onRestore(); row.remove(); await loadBoard(false); toast('已復原「' + title + '」', true); }
                        catch (e) { b.disabled = false; toast(e.message); }
                    };
                    row.append(left, b); list.appendChild(row);
                };
                section('📁 作業與考試卡片');
                if (!t.cards.length) list.appendChild(el('div', 'trash-meta', '沒有'));
                for (const c of t.cards) {
                    item((c.kind === 'exam' ? '📝 ' : '📁 ') + c.name,
                        fmtTime(c.deletedAt) + '・' + (REASON[c.reason] || '') + '・' + c.pending + ' 人未完成',
                        () => api('POST', '/api/cards/' + c.id + '/restore'));
                }
                section('📸 相簿');
                if (!t.albums.length) list.appendChild(el('div', 'trash-meta', '沒有'));
                for (const a of t.albums) {
                    item(a.icon + ' ' + a.name, fmtTime(a.deletedAt), () => api('POST', '/api/albums/' + a.id + '/restore'));
                }
            } catch (e) {
                list.textContent = e.message;
            }
        }
        function closeTrash() { document.getElementById('trashOverlay').classList.remove('show'); }

        // ---------- 閉嘴牆、總表、查詢 ----------
        function debtsOf(seat) {
            return {
                daily: board.daily.filter(c => (c.statuses[seat - 1] || 0) > 0).map(c => c.name),
                exam: board.exam.filter(c => (c.statuses[seat - 1] || 0) > 0).map(c => c.name),
            };
        }

        function buildShutUpWall() {
            const grid = document.getElementById('wallGrid'); grid.replaceChildren();
            for (let s = 1; s <= board.studentCount; s++) {
                const d = debtsOf(s);
                const box = el('div', 'wall-student-box');
                if (!d.daily.length && !d.exam.length) {
                    box.classList.add('clean');
                    const ok = el('div', '', '✨ 全數通關！'); ok.style.cssText = 'color:#2a9d8f; font-size:0.85rem; font-weight:bold;';
                    box.append(el('div', 'wall-no is-clean', '😇 ' + pad(s) + '號'), ok);
                } else {
                    box.classList.add('has-debt');
                    box.appendChild(el('div', 'wall-no is-debt', '👤 ' + pad(s) + '號'));
                    for (const i of d.daily) box.appendChild(el('div', 'wall-debt-item', '📁 ' + i));
                    for (const i of d.exam) box.appendChild(el('div', 'wall-debt-item', '📝 ' + i));
                }
                grid.appendChild(box);
            }
        }

        function hideWall() { document.getElementById('shutUpWall').style.display = 'none'; }

        async function exportDebtReport() {
            let str = '📋 NICE家族 欠交/補考 總追債報告\n(產出時間: ' + new Date().toLocaleTimeString() + ')\n-------------------------\n';
            let clean = 0;
            for (let s = 1; s <= board.studentCount; s++) {
                const d = debtsOf(s);
                if (!d.daily.length && !d.exam.length) { clean++; continue; }
                str += '👤 ' + pad(s) + '號：\n';
                if (d.daily.length) str += '  📁 作業 -> ' + d.daily.join('、') + '\n';
                if (d.exam.length) str += '  📝 補考 -> ' + d.exam.join('、') + '\n';
                str += '\n';
            }
            str += '-------------------------\n🎉 目前共有 ' + clean + ' 位優秀天使全數過關！';
            buildShutUpWall();
            const wall = document.getElementById('shutUpWall');
            wall.style.display = 'block';
            wall.scrollIntoView({ behavior: 'smooth' });
            try { await navigator.clipboard.writeText(str); toast('總表已複製，可以直接貼上', true); }
            catch { toast('無法自動複製，請改用閉嘴牆截圖'); }
        }

        function searchStudentMissing() {
            const seat = parseInt(document.getElementById('searchNo').value, 10);
            const valid = !isNaN(seat) && seat >= 1 && seat <= board.studentCount;
            // 老師直接開補交櫃台
            if (isTeacher()) { openCounter(valid ? seat : undefined); return; }
            if (!valid) { toast('請輸入 1～' + board.studentCount + ' 的座號'); return; }
            const d = debtsOf(seat);
            if (!d.daily.length && !d.exam.length) {
                alert('🎉 恭喜！【 ' + seat + ' 號】目前全部過關！');
            } else {
                alert('📋 【 ' + seat + ' 號】未完成報告：\n\n【日常】\n' + (d.daily.map(i => '📌 ' + i).join('\n') || '無') +
                      '\n\n【考試】\n' + (d.exam.map(i => '📝 ' + i).join('\n') || '無'));
            }
        }

        function toggleCustomInput() {
            const select = document.getElementById('taskSelect');
            const customInput = document.getElementById('customInput');
            customInput.style.display = select.value === 'CUSTOM' ? 'inline-block' : 'none';
            if (select.value === 'CUSTOM') customInput.focus();
        }
    </script>
</body>
</html>
